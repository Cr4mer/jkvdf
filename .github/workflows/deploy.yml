name: Deploy webapp (Firebase Hosting)

# Every push to master builds the site and deploys it to Firebase Hosting, so the
# live site always matches master — no local git, build, or firebase CLI needed.
#
# Deploys HOSTING ONLY on purpose:
#   - Functions can't deploy on the Spark plan and would abort the whole deploy.
#   - Firestore rules need extra IAM permissions; deploy those manually when they
#     change (firebase deploy --only firestore:rules).
#
# Requires the FIREBASE_SERVICE_ACCOUNT repo secret (same one the Premier ingest
# uses). That service account needs Firebase Hosting Admin (or Editor).
on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      # Vite inlines VITE_* vars at BUILD time. They live in a gitignored .env.local
      # locally, so CI must supply them or the bundle ships with an undefined Firebase
      # config and the app dies on load with auth/invalid-api-key. Fail loudly instead.
      - name: Write client env (Firebase web config)
        env:
          VITE_ENV_FILE: ${{ secrets.VITE_ENV_FILE }}
        run: |
          if [ -z "$VITE_ENV_FILE" ]; then
            echo "::error::VITE_ENV_FILE secret is not set. Without it the build ships an undefined Firebase config and the live site breaks (auth/invalid-api-key). Add the contents of your local .env.local as the VITE_ENV_FILE repo secret." >&2
            exit 1
          fi
          printf '%s\n' "$VITE_ENV_FILE" > .env.production
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_AUTH_DOMAIN; do
            if ! grep -qE "^${key}=.+" .env.production; then
              echo "::error::${key} is missing or empty in the VITE_ENV_FILE secret." >&2
              exit 1
            fi
          done
          echo "Client env OK ($(grep -c '^VITE_' .env.production) VITE_* vars)"

      - name: Build
        run: npm run build

      # Hard gate: never publish a bundle whose Firebase config failed to inline.
      - name: Verify Firebase config was bundled
        run: |
          if ! grep -rqF "jkvdf-d185b" dist/assets/*.js; then
            echo "::error::Built bundle contains no Firebase project id — the config did not inline. Refusing to deploy a broken site." >&2
            exit 1
          fi
          if grep -rqF "apiKey:void 0" dist/assets/*.js || grep -rqF "apiKey:undefined" dist/assets/*.js; then
            echo "::error::Built bundle has an undefined Firebase apiKey. Refusing to deploy a broken site." >&2
            exit 1
          fi
          echo "Firebase config inlined OK"

      - name: Show what will be deployed
        run: |
          echo "Files in dist:"
          find dist -type f | sort
          echo "Total: $(find dist -type f | wc -l) files"

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set" >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting
        run: >
          npx firebase deploy
          --only hosting
          --project jkvdf-d185b
          --non-interactive
          --message "${{ github.sha }}"
